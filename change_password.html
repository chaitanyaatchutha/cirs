<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#004080;
            color:white;
            border:none;
            cursor:pointer;
        }

        .msg{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }
    </style>

</head>

<body>

<div class="container">

<h2 align="center">Change Password</h2>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <div class="msg">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="/change_password" method="POST">

<input type="password"
name="old_password"
placeholder="Current Password"
required>

<input type="password"
name="new_password"
placeholder="New Password"
required>

<input type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit">
Change Password
</button>

</form>

</div>

</body>
</html>
