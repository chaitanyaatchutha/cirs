<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Complaint Management System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }header{
    background:#004080;
    color:white;
    padding:20px;
}

header h1{
    text-align:center;
}header h2{
    text-align:center;
}

nav{
    margin-top:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}
.container {
    display: flex;
    justify-content: center;   /* horizontal center */
    align-items: center;       /* vertical center */
    height: 100vh;             /* full screen height */
}

        body{
            background:linear-gradient(135deg,#0f4c81,#3a86ff);
        }

        .login-box{
            background:#fff;
            width:350px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-box h2{
            color:#0f4c81;
            margin-bottom:10px;
        }

        .login-box p{
            color:#555;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0f4c81;
            color:#fff;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#083b63;
        }

        .links{
            margin-top:15px;
        }

        .links a{
            text-decoration:none;
            color:#0f4c81;
            font-size:14px;
        }

        .links a:hover{
            text-decoration:underline;
        }

        .logo{
            font-size:45px;
            margin-bottom:10px;
        }
        .flash-message{
            color: red;
            border:1px solid #f5c6cb;
            padding:12px;
            margin-bottom:15px;
            border-radius:5px;
            text-align:center;
            font-weight:bold;
        }
    </style>
</head>
<body>
<header>
<h1>Campus Issue Resolution System</h1>

<nav>
<a href="/">Home</a>
<a href="/studentlogin">Student Login</a>
<a href="/adminlogin">Admin Login</a>
<a href="#">Contact</a>
</nav>
</header>
<div class="container">
<div class="login-box">
    <div class="logo">🎓</div>
    <h2>Student Login</h2>
    <p>Campus Complaint Management System</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login" method="post">
        <input type="text" name="studentid" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="links">
        <a href="/studentregistration">New Student? Register Here</a>
    </div>
</div>
</div>

</body>
</html>
