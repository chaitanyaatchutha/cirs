<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }
	
        header{
    background:#004080;
    color:white;
    padding:20px;
}

header h1{
    text-align:center;
}header h2{
    text-align:center;
}

nav{
    margin-top:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}


        .logout-btn{
            background:#e74c3c;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
        }

        .logout-btn:hover{
            background:#c0392b;
        }

        .container{
            width:80%;
            margin:50px auto;
            text-align:center;
        }

        .welcome{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            margin-bottom:40px;
        }

        .welcome h1{
            color:#2c3e50;
            margin-bottom:10px;
        }

        .cards{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            width:250px;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card h3{
            margin-bottom:20px;
            color:#34495e;
        }

        .btn{
            display:inline-block;
            background:#3498db;
            color:white;
            text-decoration:none;
            padding:12px 20px;
            border-radius:5px;
            transition:.3s;
        }

        .btn:hover{
            background:#2980b9;
        }
    </style>
</head>
<body>
<header>
<h1>Campus Issue Resolution System</h1>

<nav>
<a href="/">Home</a>
<a href="/studentlogin">Student Login</a>
<a href="/adminlogin">Admin Login</a>
<a href="#">Contact</a>
<h2>Student Dashboard</h2>
</nav>
</header>
    <div class="container">

        <div class="welcome">
            <h1>Welcome, Student!</h1>
            <p>Manage your complaints quickly and easily.</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Change Password</h3>
                <a href="/change_password" class="btn">Change Password</a>
            </div>
            <div class="card">
                <h3>New Complaint</h3>
                <a href="/new_complaint" class="btn">Register Complaint</a>
            </div>

            <div class="card">
                <h3>Complaint Status</h3>
                <a href="/complaint_status" class="btn">View Status</a>
            </div>
        </div>
        <a href="/logout" class="logout-btn">Log Out</a>
    </div>

</body>
</html>
