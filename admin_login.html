<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Body */
body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
}

/* Header */
header{
    background:#004080;
    color:white;
    padding:20px;
    width:100%;
}

header h1{
    text-align:center;
}

header h2{
    text-align:center;
}

/* Navigation */
nav{
    margin-top:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
}

nav a:hover{
    text-decoration:underline;
}

/* Container */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:calc(100vh - 120px);
}

/* Login Box */
.login-box{
    background:white;
    width:350px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    text-align:center;
}

/* Logo */
.logo{
    width:80px;
    margin-bottom:15px;
}

/* Heading */
.login-box h2{
    color:#1e3c72;
    margin-bottom:20px;
}

/* Input Fields */
.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.login-box input:focus{
    border-color:#1e3c72;
}

/* Button */
.login-box button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#1e3c72;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

.login-box button:hover{
    background:#16325c;
}

/* Forgot Password */
.forgot{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#2a5298;
}

.forgot:hover{
    text-decoration:underline;
}
        .flash-message{
            color: red;
            border:1px solid #f5c6cb;
            padding:12px;
            margin-bottom:15px;
            border-radius:5px;
            text-align:center;
            font-weight:bold;
        }
</style>

</head>
<body>
<header>
<h1>Campus Issue Resolution System</h1>

<nav>
<a href="/">Home</a>
<a href="/studentlogin">Student Login</a>
<a href="/adminlogin">Admin Login</a>
<a href="#">Contact</a>
</nav>
</header>
<div class="container">
<div class="login-box">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo">

    <h2>Admin Login</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form action="/admin_login" method="POST">

        <input type="text"
               name="username"
               placeholder="Admin Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

</div>
</div>

</body>
</html>
